<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150" role="img" aria-label="Hello Lock">
  <!-- a pixel padlock, lit cell by cell like the logo as you type -->
  <g transform="translate(44,30)" fill="#E6E8EE">
    <g opacity="0.95"><rect x="24" y="0" width="8" height="8"/><rect x="32" y="0" width="8" height="8"/><rect x="40" y="0" width="8" height="8"/><rect x="48" y="0" width="8" height="8"/><rect x="16" y="8" width="8" height="8"/><rect x="56" y="8" width="8" height="8"/><rect x="16" y="16" width="8" height="8"/><rect x="56" y="16" width="8" height="8"/><rect x="16" y="24" width="8" height="8"/><rect x="56" y="24" width="8" height="8"/></g>
    <g fill="#7AA2F7"><rect x="8" y="32" width="64" height="8"/><rect x="8" y="40" width="64" height="8"/><rect x="8" y="48" width="64" height="8"/><rect x="8" y="56" width="64" height="8"/><rect x="8" y="64" width="64" height="8"/><rect x="8" y="72" width="64" height="8"/></g>
    <g fill="#0F1218"><rect x="36" y="44" width="8" height="8"/><rect x="36" y="52" width="8" height="8"/><rect x="36" y="60" width="8" height="8"/></g>
    <g fill="#7AA2F7" opacity="0.35"><rect x="80" y="40" width="8" height="8"/><rect x="88" y="48" width="8" height="8"/><rect x="0" y="48" width="8" height="8"/></g>
  </g>
  <text x="190" y="84" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2" fill="#E6E8EE">Hello Lock</text>
  <text x="192" y="116" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#9AA3B2">A lock screen for Omarchy that greets you.</text>
</svg>
